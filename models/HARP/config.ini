[general]
output_name = models/HARP/output
device = cuda:0
steps_per_epoch = 1
# Full-data run: ~40,985 train molecules / 16 ranks = ~2,560 per rank.
# N_batches=100 keeps per-batch ~26 molecules -- same activation footprint as
# the h_v8_noG subset run (peak ~18 GB there; data grows +10 GB here).
N_batches = 100
N_epoch = 2000
lr_init = 3e-3
lr_final = 1e-4
lr_decay_steps = 100
Nsave = 5
world_size = 16
ddp_mode = elastic
ddp_backend = nccl
nodeRDM_flag = False
# set load_model = True and point load_model_path at a checkpoint to resume
load_model = False
load_model_path =
head_type = hamiltonian
# HARP: B3LYP/def2-SVP baseline, gap read directly off the frontier
# eigenvalues (no learned rescaling).
gap_rescale = none
delta_learning = True
delta_baseline = b3lyp
basic_subdir = basic_B3LYP
tmp_subdir = tmp_basic_b3lyp

[element]
list = H,C,N,O,F,Si,P,S,Cl

[scaling]
V = 1
T = 0.01

[OPS]
E = 1.
x = 0.1
y = 0.1
z = 0.1
xx = 0.01
yy = 0.01
zz = 0.01
xy = 0.01
yz = 0.01
xz = 0.01
atomic_charge = 0.01
E_gap = 0.2
bond_order = 0.02
alpha = 3e-5

[data]
# Full P_S_Cl_dataset_v3 crawl: every group 2001..44412 (h_v8_noG skipped
# 2001_3000 and capped at 10k molecules via max_items; both lifted here).
datagroups = P_S_Cl_dataset_v3/P_S_Cl_data_2001_3000, P_S_Cl_dataset_v3/P_S_Cl_data_3001_7000, P_S_Cl_dataset_v3/P_S_Cl_data_7001_12000, P_S_Cl_dataset_v3/P_S_Cl_data_12001_17000, P_S_Cl_dataset_v3/P_S_Cl_data_17001_22000, P_S_Cl_dataset_v3/P_S_Cl_data_22001_29000, P_S_Cl_dataset_v3/P_S_Cl_data_29001_44412
val_datagroups = P_S_Cl_dataset_v3/P_S_Cl_data_1001_2000

[test]
datagroups = P_S_Cl_dataset_v3/P_S_Cl_data_1_1000
model_file = 1265_model.pt
batch_size = 50

[backbone]
type = esen
r_max = 6.0
max_neighbors = 20
num_layers = 4
sphere_channels = 64
attn_hidden_channels = 64
num_heads = 8
lmax_list = 4
mmax_list = 4
pretrain_checkpoint =
norm_type = rms_norm_sh
use_s2_act_attn = False
use_attn_renorm = True
use_gate_act = True
use_grid_mlp = False
use_sep_s2_act = True
alpha_drop = 0.1
drop_path_rate = 0.05
proj_drop = 0.0
weight_init = uniform
activation_checkpoint = False
